name: Fuzz

on:
  schedule:
    - cron: "33 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  atheris:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Build accelerator in place
        run: >-
          uv run --no-project --python 3.12
          --with setuptools --with "packaging>=24.2" --with cython
          python setup.py build_ext --inplace

      - name: Seed corpus
        run: |
          mkdir -p corpus artifacts
          uv run --no-project --python 3.12 python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import cborx
          samples = [
              {"ints": [0, -1, 2**64 - 1, 2**70], "f": [1.5, float("nan")]},
              ["a", "b", {"k": [1, [2, [3]]]}, b"\x00\xff"],
              {"nested": {"deep": [[[[[]]]]]}},
          ]
          for i, obj in enumerate(samples):
              for kw in ({}, {"canonical": True}, {"indefinite": True}):
                  with open(f"corpus/seed{i}_{len(kw)}", "wb") as fh:
                      fh.write(cborx.dumps(obj, **kw))
          # Known adversarial shapes
          open("corpus/reg_overflow_map", "wb").write(bytes.fromhex(
              "a6646e7473201bffffffffffffffff3bffffffffffffffff"
              "c24940000000000000000066666c6f61747385fb0000000000"
              "000000bb80000000000000006265404200ff"))
          open("corpus/reg_huge_array", "wb").write(
              bytes.fromhex("9bffffffffffffffff01"))
          open("corpus/reg_indefinite", "wb").write(
              bytes.fromhex("9f018202039f0405ffff"))
          PY

      - name: Fuzz both backends
        run: >-
          uv run --no-project --python 3.12 --with atheris==3.1.0
          python tests/fuzz_atheris.py corpus
          -max_total_time=900 -rss_limit_mb=2048 -artifact_prefix=artifacts/

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: artifacts/
          if-no-files-found: ignore
